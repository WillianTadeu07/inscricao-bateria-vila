<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrições - Bateria Acadêmicos da Vila</title>
  <style>
    :root {
      --azul-principal: #3182CE;
      --rosa-destaque: #D53F8C;
      --fundo: #121212;
      --card-fundo: #1E1E1E;
      --texto-branco: #FFFFFF;
      --texto-secundario: #E2E8F0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--fundo);
      color: var(--texto-branco);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: var(--card-fundo);
      max-width: 600px;
      width: 100%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border-top: 6px solid var(--rosa-destaque);
    }

    .header-logos {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-logos img {
      max-height: 80px;
      object-fit: contain;
    }

    h1 {
      color: var(--rosa-destaque);
      text-align: center;
      margin-bottom: 10px;
      font-size: 24px;
    }

    p.subtitulo {
      text-align: center;
      color: var(--texto-secundario);
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--azul-principal);
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #4A5568;
      background-color: #2D3748;
      color: var(--texto-branco);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }

    input::placeholder {
      color: #A0AEC0;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--rosa-destaque);
      box-shadow: 0 0 0 3px rgba(213, 63, 140, 0.3);
    }

    .campos-responsavel {
      display: none;
      background-color: #2B2638;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid var(--rosa-destaque);
      margin-bottom: 20px;
    }

    button {
      width: 100%;
      background-color: var(--azul-principal);
      color: white;
      border: none;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--rosa-destaque);
    }

    button:disabled {
      background-color: #4A5568;
      color: #A0AEC0;
      cursor: not-allowed;
    }

    #mensagem-sucesso {
      display: none;
      background-color: #1C4532;
      color: #9AE6B4;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    .loading-vagas {
      font-size: 13px;
      color: var(--texto-secundario);
      margin-top: 6px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-logos">
      <img src="WhatsApp Image 2026-10-02 at 15.13.07.jpeg" alt="Brasão Bateria">
      <img src="WhatsApp Image 2026-10-02 at 15.13.06.jpeg" alt="Mascote Bateria">
    </div>

    <h1>Inscrição Ritmista - Acadêmicos da Vila</h1>
    <p class="subtitulo">Preencha os dados abaixo para fazer sua inscrição na bateria.</p>

    <form id="form-inscricao">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
      </div>

      <div class="form-group">
        <label for="whatsapp">WhatsApp / Celular</label>
        <input type="tel" id="whatsapp" name="whatsapp" required placeholder="(11) 99999-9999">
      </div>

      <div class="form-group">
        <label for="idade">Idade</label>
        <input type="number" id="idade" name="idade" required min="5" max="120" placeholder="Digite sua idade">
      </div>

      <div id="box-responsavel" class="campos-responsavel">
        <div class="form-group">
          <label for="nome_responsavel">Nome do Responsável</label>
          <input type="text" id="nome_responsavel" name="nome_responsavel" placeholder="Digite o nome do pai, mãe ou responsável legal">
        </div>

        <div class="form-group" style="margin-bottom: 0;">
          <label for="tel_responsavel">Telefone do Responsável</label>
          <input type="tel" id="tel_responsavel" name="tel_responsavel" placeholder="(11) 99999-9999">
        </div>
      </div>

      <div class="form-group">
        <label for="instrumento">Instrumento Pretendido</label>
        <select id="instrumento" name="instrumento" required>
          <option value="">Selecione um instrumento...</option>
          <option value="Surdo de 1ª">Surdo de 1ª</option>
          <option value="Surdo de 2ª">Surdo de 2ª</option>
          <option value="Surdo de 3ª">Surdo de 3ª</option>
          <option value="Caixa">Caixa</option>
          <option value="Repinique">Repinique</option>
          <option value="Tamborim">Tamborim</option>
          <option value="Agogô">Agogô</option>
          <option value="Timbal">Timbal</option>
          <option value="Chocalho">Chocalho</option>
        </select>
        <div id="status-carregamento" class="loading-vagas">Atualizando saldo de vagas em tempo real...</div>
      </div>

      <div class="form-group">
        <label for="experiencia">Já possui experiência tocando?</label>
        <select id="experiencia" name="experiencia" required>
          <option value="Iniciante">Não, sou iniciante</option>
          <option value="Intermediário">Sim, nível intermediário</option>
          <option value="Avançado">Sim, já toquei em outras baterias</option>
        </select>
      </div>

      <button type="submit" id="btn-enviar">Enviar Inscrição</button>
    </form>

    <div id="mensagem-sucesso">
      Inscrição realizada com sucesso! A diretoria entrará em contato em breve.
    </div>
  </div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwPGCcd9xMcCAXNQve6l1gTq4n2lGQsixhPeKFeSok5wGe-HRah5KhTwksh-aGss_apkg/exec';

    const inputIdade = document.getElementById('idade');
    const boxResponsavel = document.getElementById('box-responsavel');
    const inputNomeResp = document.getElementById('nome_responsavel');
    const inputTelResp = document.getElementById('tel_responsavel');

    inputIdade.addEventListener('input', function() {
      const idade = parseInt(this.value, 10);
      
      if (!isNaN(idade) && idade < 18) {
        boxResponsavel.style.display = 'block';
        inputNomeResp.required = true;
        inputTelResp.required = true;
      } else {
        boxResponsavel.style.display = 'none';
        inputNomeResp.required = false;
        inputTelResp.required = false;
        inputNomeResp.value = '';
        inputTelResp.value = '';
      }
    });

    function carregarVagas() {
      const selectInst = document.getElementById('instrumento');
      const statusTxt = document.getElementById('status-carregamento');

      fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(vagas => {
          Array.from(selectInst.options).forEach(option => {
            const inst = option.value;
            if (inst && vagas[inst]) {
              const info = vagas[inst];
              if (info.disponivel) {
                option.textContent = `${inst} (${info.restantes} vaga${info.restantes > 1 ? 's' : ''})`;
                option.disabled = false;
              } else {
                option.textContent = `${inst} - (Esgotado)`;
                option.disabled = true;
              }
            }
          });

          statusTxt.style.display = 'none';
        })
        .catch(err => {
          console.error(err);
          statusTxt.innerText = 'Você já pode selecionar seu instrumento e se inscrever.';
          statusTxt.style.color = '#A0AEC0';
        });
    }

    window.addEventListener('DOMContentLoaded', carregarVagas);

    document.getElementById('form-inscricao').addEventListener('submit', function(e) {
      e.preventDefault();

      const btn = document.getElementById('btn-enviar');
      btn.innerText = 'Enviando...';
      btn.disabled = true;

      const dados = {
        nome: document.getElementById('nome').value,
        whatsapp: document.getElementById('whatsapp').value,
        idade: document.getElementById('idade').value,
        nome_responsavel: inputNomeResp.value || 'N/A',
        tel_responsavel: inputTelResp.value || 'N/A',
        instrumento: document.getElementById('instrumento').value,
        experiencia: document.getElementById('experiencia').value,
        data: new Date().toLocaleString('pt-BR')
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(dados)
      })
      .then(() => {
        document.getElementById('form-inscricao').reset();
        boxResponsavel.style.display = 'none';
        document.getElementById('mensagem-sucesso').style.display = 'block';
        btn.innerText = 'Enviar Inscrição';
        btn.disabled = false;

        carregarVagas();
      })
      .catch(error => {
        alert('Ocorreu um erro ao enviar sua inscrição. Tente novamente.');
        btn.innerText = 'Enviar Inscrição';
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
