<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscrições - Bateria Acadêmicos da Vila</title>
  <style>
    :root {
      --azul-principal: #1A365D;
      --rosa-destaque: #D53F8C;
      --fundo: #F7FAFC;
      --texto: #2D3748;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--fundo);
      color: var(--texto);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      background: white;
      max-width: 600px;
      width: 100%;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border-top: 6px solid var(--rosa-destaque);
    }

    .header-logos {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .header-logos img {
      max-height: 80px;
      object-fit: contain;
    }

    h1 {
      color: var(--azul-principal);
      text-align: center;
      margin-bottom: 10px;
      font-size: 24px;
    }

    p.subtitulo {
      text-align: center;
      color: #718096;
      margin-bottom: 30px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--azul-principal);
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #CBD5E0;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 16px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--rosa-destaque);
      box-shadow: 0 0 0 3px rgba(213, 63, 140, 0.2);
    }

    button {
      width: 100%;
      background-color: var(--azul-principal);
      color: white;
      border: none;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--rosa-destaque);
    }

    button:disabled {
      background-color: #A0AEC0;
      cursor: not-allowed;
    }

    #mensagem-sucesso {
      display: none;
      background-color: #DEF7EC;
      color: #03543F;
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }

    .loading-vagas {
      font-size: 14px;
      color: #718096;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-logos">
      <img src="WhatsApp Image 2026-10-02 at 15.13.07.jpeg" alt="Brasão Bateria">
      <img src="WhatsApp Image 2026-10-02 at 15.13.06.jpeg" alt="Mascote Bateria">
    </div>

    <h1>Inscrição Ritmista - Acadêmicos da Vila</h1>
    <p class="subtitulo">Preencha os dados abaixo para fazer sua inscrição na bateria.</p>

    <form id="form-inscricao">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" required placeholder="Digite seu nome completo">
      </div>

      <div class="form-group">
        <label for="whatsapp">WhatsApp / Celular</label>
        <input type="tel" id="whatsapp" name="whatsapp" required placeholder="(11) 99999-9999">
      </div>

      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="seu@email.com">
      </div>

      <div class="form-group">
        <label for="instrumento">Instrumento Pretendido</label>
        <select id="instrumento" name="instrumento" required disabled>
          <option value="">Carregando vagas disponíveis...</option>
        </select>
        <div id="status-carregamento" class="loading-vagas">Consultando disponibilidade de vagas...</div>
      </div>

      <div class="form-group">
        <label for="experiencia">Já possui experiência tocando?</label>
        <select id="experiencia" name="experiencia" required>
          <option value="Iniciante">Não, sou iniciante</option>
          <option value="Intermediário">Sim, nível intermediário</option>
          <option value="Avançado">Sim, já toquei em outras baterias</option>
        </select>
      </div>

      <button type="submit" id="btn-enviar" disabled>Enviar Inscrição</button>
    </form>

    <div id="mensagem-sucesso">
      Inscrição realizada com sucesso! A diretoria entrará em contato em breve.
    </div>
  </div>

  <script>
    // COLE A SUA URL DO GOOGLE APPS SCRIPT AQUI:
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxmZwVtuZom8nUzlieyvwxknabJ0giYHYvSbUyL8gdMCOfSzZftCCQii5ix0D124PRiaw/exec';

    // Função para buscar o saldo de vagas na planilha
    function carregarVagas() {
      const selectInst = document.getElementById('instrumento');
      const statusTxt = document.getElementById('status-carregamento');
      const btnEnviar = document.getElementById('btn-enviar');

      fetch(SCRIPT_URL)
        .then(response => response.json())
        .then(vagas => {
          selectInst.innerHTML = '<option value="">Selecione um instrumento...</option>';
          let temVaga = false;

          for (const [inst, info] of Object.entries(vagas)) {
            const option = document.createElement('option');
            option.value = inst;
            
            if (info.disponivel) {
              option.textContent = `${inst} (${info.restantes} vaga${info.restantes > 1 ? 's' : ''} restante${info.restantes > 1 ? 's' : ''})`;
              temVaga = true;
            } else {
              option.textContent = `${inst} - (Esgotado)`;
              option.disabled = true;
            }
            selectInst.appendChild(option);
          }

          selectInst.disabled = false;
          btnEnviar.disabled = false;
          statusTxt.style.display = 'none';
        })
        .catch(err => {
          console.error(err);
          statusTxt.innerText = 'Erro ao carregar vagas. Atualize a página.';
          statusTxt.style.color = 'red';
        });
    }

    // Carrega as vagas assim que a página abre
    window.addEventListener('DOMContentLoaded', carregarVagas);

    // Envio do Formulário
    document.getElementById('form-inscricao').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const btn = document.getElementById('btn-enviar');
      btn.innerText = 'Enviando...';
      btn.disabled = true;

      const dados = {
        nome: document.getElementById('nome').value,
        whatsapp: document.getElementById('whatsapp').value,
        email: document.getElementById('email').value,
        instrumento: document.getElementById('instrumento').value,
        experiencia: document.getElementById('experiencia').value,
        data: new Date().toLocaleString('pt-BR')
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(dados)
      })
      .then(() => {
        document.getElementById('form-inscricao').reset();
        document.getElementById('mensagem-sucesso').style.display = 'block';
        btn.innerText = 'Enviar Inscrição';
        
        // Recarrega as vagas atualizadas
        carregarVagas();
      })
      .catch(error => {
        alert('Ocorreu um erro ao enviar sua inscrição. Tente novamente.');
        btn.innerText = 'Enviar Inscrição';
        btn.disabled = false;
      });
    });
  </script>
</body>
</html>
